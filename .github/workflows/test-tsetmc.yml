name: Test Daily TSETMC

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get daily market data
        run: |
          DATE=$(date -u +"%Y%m%d")
          echo "DATE=$DATE"

          URL="https://cdn.tsetmc.com/api/ClosingPrice/GetInstrmentsHistoryInDay/$DATE"

          echo "Requesting:"
          echo "$URL"

          curl -L --max-time 30 \
            -A "Mozilla/5.0" \
            -o response.json \
            "$URL"

          echo "File size:"
          wc -c response.json

          echo "First 2000 characters:"
          head -c 2000 response.json
          echo
